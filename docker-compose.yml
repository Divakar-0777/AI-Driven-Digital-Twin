version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_digital_twin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dt-backend
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_digital_twin
      JWT_SECRET: ${JWT_SECRET:-super-secret-digital-twin-key-2026}
      AI_SERVICE_URL: http://ai-service:8000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run dev"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: dt-ai-service
    environment:
      AI_SERVICE_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-super-secret-digital-twin-key-2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dt-frontend
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
